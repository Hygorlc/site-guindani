<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Guindani — Joalheria de Luxo</title>
    <meta name="description" content="Guindani — Joalheria de luxo com anéis, colares, pulseiras, brincos, pingentes e alianças. Qualidade e elegância para momentos especiais." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Lato:wght@300;400;700;900&family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/jpeg" href="/manus-storage/LOGOGUINDANIFUNDOBRANCO_5cf9cbef.jpeg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (() => {
        const hiddenFooterLinks = new Set([
          "Certificações",
          "Sustentabilidade",
          "Política de Troca",
          "Garantia",
          "FAQ",
        ]);

        const updateVisibleText = () => {
          const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
          let node = walker.nextNode();

          while (node) {
            node.nodeValue = node.nodeValue
              ?.replace(/Diamantes/g, "Pingentes")
              .replace(/diamantes/g, "pingentes")
              .replace(/comercial@gmail\.com\.br/g, "comercial@guindani.com.br")
              .replace(/Seg a Sex: 08:30 às 17:30 \| Sáb: 9h às 13h/g, "Segunda-feira a sexta-feira das 8:30 às 17:30") ?? "";
            node = walker.nextNode();
          }
        };

        const styleHeader = () => {
          const header = document.querySelector("header");
          if (!header) return;

          header.style.background = "rgba(12, 10, 8, 0.72)";
          header.style.backdropFilter = "blur(10px)";
          header.style.boxShadow = "0 1px 0 rgba(201,169,110,0.32)";
          header.style.minHeight = "0";

          const container = header.querySelector(".container");
          if (container) {
            container.style.paddingTop = "8px";
            container.style.paddingBottom = "8px";
          }

          const row = header.querySelector(".flex.items-center.justify-between");
          if (row) {
            row.style.flexDirection = "column";
            row.style.justifyContent = "center";
            row.style.gap = "6px";
          }

          const logo = header.querySelector("a[href='#'] img[alt='Guindani']");
          if (logo) {
            logo.style.maxHeight = "54px";
            logo.style.width = "auto";
            logo.style.objectFit = "contain";
          }

          const logoLink = header.querySelector("a[href='#']");
          if (logoLink) {
            logoLink.style.justifyContent = "center";
          }

          const nav = header.querySelector("nav");
          if (nav) {
            nav.style.width = "100%";
            nav.style.justifyContent = "center";
            nav.style.gap = "clamp(18px, 5vw, 54px)";
            nav.style.padding = "7px 14px";
            nav.style.background = "rgba(201, 169, 110, 0.18)";
            nav.style.borderTop = "1px solid rgba(201, 169, 110, 0.28)";
            nav.style.borderBottom = "1px solid rgba(201, 169, 110, 0.18)";
            nav.style.marginTop = "2px";
          }

          header.querySelectorAll("nav a").forEach((link) => {
            link.style.color = "#F4E7C8";
            link.style.fontSize = "0.72rem";
            link.style.letterSpacing = "0.14em";
            link.style.fontWeight = "700";
          });
        };

        const styleHistoryTitle = () => {
          document.querySelectorAll("h1, h2, h3").forEach((heading) => {
            const text = heading.textContent?.toUpperCase() ?? "";
            if (text.includes("TRABALHAR COM SERIEDADE E QUALIDADE")) {
              heading.style.fontFamily = "'Playfair Display', serif";
              heading.style.fontWeight = "700";
              heading.style.letterSpacing = "0.01em";
              heading.style.textTransform = "uppercase";
            }
          });
        };

        const styleCategoryImages = () => {
          document.querySelectorAll("img[alt='Gargantilhas']").forEach((image) => {
            image.src = "/images/gargantilhas-cover.jpg";
            image.style.objectPosition = "center center";
          });
        };

        const styleFooterLogo = () => {
          document.querySelectorAll("footer img[alt='Guindani']").forEach((logo) => {
            logo.style.width = "112px";
            logo.style.height = "112px";
            logo.style.maxWidth = "112px";
            logo.style.objectFit = "contain";
          });
        };

        const cleanFooter = () => {
          document.querySelectorAll("footer a").forEach((link) => {
            const label = link.textContent?.trim();
            if (label && hiddenFooterLinks.has(label)) {
              link.closest("li")?.remove();
            }
          });

          document.querySelectorAll("footer p").forEach((paragraph) => {
            const text = paragraph.textContent?.trim() ?? "";
            if (
              text.includes("Joalheria de luxo com peças exclusivas") &&
              text.includes("ouro 18k") &&
              text.includes("prata 925")
            ) {
              paragraph.remove();
            }
          });
        };

        const refreshText = () => {
          updateVisibleText();
          styleHeader();
          styleHistoryTitle();
          styleCategoryImages();
          styleFooterLogo();
          cleanFooter();
        };

        const root = document.getElementById("root");
        if (root) {
          new MutationObserver(refreshText).observe(root, { childList: true, subtree: true });
        }

        window.addEventListener("load", refreshText);
        refreshText();
      })();
    </script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>
</html>
